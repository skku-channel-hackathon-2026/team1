    <script>
      var appearance =
        typeof ChannelIOWam !== 'undefined'
          ? ChannelIOWam.getWamData('appearance')
          : 'light'
      if (appearance === 'dark') {
        document.body.style.backgroundColor = '#464748'
      } else {
        document.body.style.backgroundColor = '#FFFFFF'
      }
    </script>
